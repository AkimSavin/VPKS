{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:18px;">
    <h1 style="font-size:36px;">Новый крафт (Создание инструкции)</h1>
    <a href="{{ url_for('inventory') }}" class="mc-btn" style="min-width: 260px; padding: 6px 24px;">← Назад в инвентарь</a>
</div>

<form method="POST" enctype="multipart/form-data" style="width: 100%;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label style="display:block; margin-bottom:4px;"><b>Название инструкции (1–120 символов) *:</b></label>
    <input type="text" name="title" class="mc-input" value="{{ form.title }}" maxlength="120" required placeholder="Например: Умная кормушка для птиц на ESP32">

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:16px; width:100%;">
        <div style="min-width:0;">
            <label style="display:block; margin-bottom:4px;"><b>Выбрать существующую категорию:</b></label>
            <select name="category_id" class="mc-select">
                <option value="">Без категории</option>
                {% for c in categories %}
                    <option value="{{ c.id }}" {% if form.category_id == c.id|string %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="min-width:0;">
            <label style="display:block; margin-bottom:4px;"><b>Или создать новую категорию (до 60 симв.):</b></label>
            <input type="text" name="new_category" class="mc-input" value="{{ form.new_category }}" maxlength="60" placeholder="Например: Электроника">
        </div>
    </div>

    <label style="display:block; margin-bottom:4px;"><b>Описание проекта (до 5000 символов):</b></label>
    <textarea name="description" class="mc-textarea" rows="4" maxlength="5000" placeholder="Краткая характеристика сборки...">{{ form.description }}</textarea>

    <label style="display:block; margin-bottom:4px;"><b>Фотография обложки (JPEG/PNG, до 5 МБ, необязательно):</b></label>
    <input type="file" name="cover_photo" class="mc-input" accept="image/jpeg,image/png">

    <div style="margin-top:8px;">
        <button type="submit" class="mc-btn green" style="min-width: 320px; height: 48px; font-size:26px; padding: 6px 28px;">Сохранить инструкцию</button>
    </div>
</form>
{% endblock %}
