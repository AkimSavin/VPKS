{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <h1 style="font-size:36px;">Управление категориями</h1>
    <a href="{{ url_for('inventory') }}" class="mc-btn" style="width:200px;">← В инвентарь</a>
</div>

<form method="POST" style="display:grid; grid-template-columns: 1fr 220px; gap:10px; margin-bottom:20px; align-items:center;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="create">
    <input type="text" name="name" class="mc-input" placeholder="Новая категория (до 60 символов)" maxlength="60" required style="margin:0;">
    <button type="submit" class="mc-btn green" style="width:100%;">Создать категорию</button>
</form>

<table class="mc-table">
    <thead>
        <tr>
            <th style="width:30%;">Название категории</th>
            <th style="width:50%;">Переименовать</th>
            <th style="width:20%;">Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for c in categories %}
        <tr>
            <td><b>{{ c.name }}</b></td>
            <td>
                <form method="POST" style="display:grid; grid-template-columns: 1fr 140px; gap:8px; align-items:center;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="action" value="rename">
                    <input type="hidden" name="cat_id" value="{{ c.id }}">
                    <input type="text" name="new_name" class="mc-input" value="{{ c.name }}" maxlength="60" required style="margin:0;">
                    <button type="submit" class="mc-btn" style="width:140px;">Сохранить</button>
                </form>
            </td>
            <td>
                <form method="POST" onsubmit="return confirm('Удалить категорию «{{ c.name }}»? Инструкции останутся и перейдут в «Без категории».');">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="action" value="delete">
                    <input type="hidden" name="cat_id" value="{{ c.id }}">
                    <button type="submit" class="mc-btn red" style="width:140px;">Удалить</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="3">У вас пока нет созданных категорий.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
