Конфигурация обратного прокси Nginx (подраздел 3.12, 8.5 и 8.11 ТЗ)
server {
listen 80;
server_name diy-instructions.local;
return 301 https://$host$request_uri;
}
server {
listen 443 ssl http2;
server_name diy-instructions.local;ssl_certificate     /etc/ssl/certs/diy.crt;
ssl_certificate_key /etc/ssl/private/diy.key;

# Лимит размера загружаемой фотографии до 5 МБ (FR-06, NFR-20)
client_max_body_size 5M;

# Быстрая раздача статики (CSS, JS, шрифты, фоновые видео)
location /static/ {
    alias /var/www/diy-app/static/;
    expires 7d;
}

# Внутренний каталог для защищенной выдачи приватных фото через X-Accel-Redirect (раздел 8.11 ТЗ)
location /protected_uploads/ {
    internal;
    alias /var/www/diy-app/data/uploads/;
}

# Проксирование запросов в WSGI-сервер Gunicorn
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
}